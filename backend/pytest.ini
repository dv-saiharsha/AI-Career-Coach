[pytest]
# `python -m pytest` puts the working directory on sys.path; bare `pytest`
# does not. The tests import `app.*`, so the first worked locally while the
# second failed in CI with ModuleNotFoundError. Setting pythonpath makes the
# import work the same way under either invocation.
pythonpath = .
testpaths = tests

# Silences the pytest-asyncio warning about the fixture loop scope default
# changing in a future release.
asyncio_default_fixture_loop_scope = function
