name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: "Backend: lint and test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 3.12, not 3.11: numpy 2.5.1 declares requires_python >= 3.12, so on
      # 3.11 pip finds no compatible wheel and walks back through pre-metadata
      # sdists until it gives up — which reads as "no matching distribution"
      # rather than as a Python version mismatch. Local dev is 3.12.10, so this
      # also closes a dev/CI drift. Bump this only alongside requirements.txt.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          # setuptools and wheel up front: without them pip falls back to a
          # legacy setup.py path for any sdist that has no wheel, which fails
          # opaquely on a clean runner.
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      # Not a pip package — a Rust binary fetched from its own GitHub
      # releases. Installed here (rather than left to self-skip, the way
      # test_ml_inference does for the trained model) so the LaTeX compile
      # path is genuinely exercised on every push, not perpetually skipped.
      - name: Install tectonic
        run: python scripts/install_tectonic.py

      # test_ml_inference self-skips when the trained model is absent, and the
      # .joblib is gitignored, so those cases are skipped here rather than failed.
      - name: Test
        run: pytest -q

  frontend:
    name: "Frontend: lint, typecheck and build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 24, matching local dev. Two separate floors push past the original 18:
      # Next 16 and Tailwind v4 need >= 20, and @supabase/supabase-js@2.110.7
      # declares engines.node >= 22. Pinning to 24 also matches the npm major
      # (11) that generated package-lock.json — npm 10 and 11 resolve optional
      # platform bindings differently, which is what broke `npm ci` here.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Narrow by design. Four defects have passed lint, typecheck and a
      # green build in this project and were only found by loading a page;
      # these cover the two shapes that caused them — list rendering over
      # repeating data, and CSS that vanishes behind a guard. Both suites
      # were verified to fail against the original bugs, not just to pass
      # against the fixes.
      - name: Test
        run: npm test

      # Written during the token work and never actually run anywhere. It
      # checks every text token against every surface it can land on, in
      # both themes.
      - name: Contrast gate
        run: node scripts/check-contrast.mjs

      # The build is the check that actually matters: it catches broken imports,
      # bad server/client boundaries, and prerender failures that lint cannot.
      # Supabase values are read at module scope, so the build needs *some*
      # value present. Real secrets are used when configured; otherwise inert
      # placeholders keep the build deterministic without exposing anything.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
